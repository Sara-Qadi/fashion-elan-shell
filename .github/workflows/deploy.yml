name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing the build to a gh-pages branch, not via
# actions/deploy-pages. The deployment-API route worked once here and then
# failed twice in a row with "Timeout reached, aborting!" and no error detail,
# while GitHub reported Pages as fully operational. A branch push is a plain git
# operation with nothing in between to time out, and it leaves the published
# output inspectable in the repository.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        run: |
          # Without this, Jekyll skips files and folders beginning with an
          # underscore, which Vite is free to emit.
          touch dist/.nojekyll

          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
