name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing through the Pages artifact API rather than a gh-pages branch.
#
# Both routes were tried here. The branch push itself always worked, but the
# legacy Jekyll build that publishes such a branch errored instantly ("Page
# build failed", duration 0) and then wedged in "building" for ~20 hours, even
# with .nojekyll present and correct content on the branch. The artifact route
# is what the sibling Cart repo uses without trouble.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pages is enabled on the repository with "GitHub Actions" as the source.
      # `enablement: true` is deliberately not used: creating the Pages site
      # needs admin rights that GITHUB_TOKEN does not carry, so it fails the job.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
